<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>OGFimg - Tile Downloader and Stitcher</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
	<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
	<script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>
	<link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css" />
	<style>
		:root {
			--primary: #007bff;
			--success: #28a745;
			--warning: #ff9800;
			--danger: #dc3545;
			--bg-light: #f8f9fa;
			--border: #dee2e6;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}

		body {
			display: flex;
			height: 100vh;
			background-color: #f4f4f4;
			overflow: hidden;
		}

		/* SIDEBAR STYLING */
		#sidebar {
			width: 320px;
			background: white;
			padding: 20px;
			display: flex;
			flex-direction: column;
			gap: 20px;
			box-shadow: 4px 0px 10px rgba(0, 0, 0, 0.05);
			z-index: 1000;
			overflow-y: auto;
			height: 100vh;
		}

		h1 {
			font-size: 1.25rem;
			color: #333;
			border-bottom: 2px solid var(--primary);
			padding-bottom: 10px;
			margin-bottom: 5px;
		}

		.section-label {
			font-weight: bold;
			font-size: 0.75rem;
			text-transform: uppercase;
			color: #888;
			margin-bottom: 5px;
			display: block;
		}

		.control-group {
			background: var(--bg-light);
			padding: 12px;
			border-radius: 8px;
			border: 1px solid var(--border);
		}

		label {
			font-size: 0.85rem;
			color: #444;
			display: block;
			margin-top: 10px;
		}

		label:first-child { margin-top: 0; }

		input, select {
			width: 100%;
			padding: 8px 10px;
			margin-top: 5px;
			border: 1px solid #ccc;
			border-radius: 5px;
			font-size: 14px;
			outline: none;
		}

		input:focus, select:focus {
			border-color: var(--primary);
			box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.1);
		}

		.coord-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
		}

		.coord-grid label {
			margin-top: 0 !important;
		}

		/* BUTTONS */
		.button-stack {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		button {
			width: 100%;
			padding: 12px;
			font-size: 14px;
			font-weight: 600;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			transition: all 0.2s;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
		}

		#startBtn { background: var(--primary); color: white; }
		#stitchBtn { background: var(--warning); color: white; }
		button:hover { filter: brightness(90%); transform: translateY(-1px); }
		button:active { transform: translateY(0); }

		/* INFO BOXES */
		#tile-preview {
			background: #fff3cd;
			border: 1px solid #ffeeba;
			padding: 12px;
			border-radius: 8px;
			font-size: 0.85rem;
			line-height: 1.4;
		}

		#progress-container {
			display: none;
			background: #e7f3ff;
			padding: 12px;
			border-radius: 8px;
			border: 1px solid #b8daff;
		}

		progress {
			width: 100%;
			height: 10px;
			margin-top: 8px;
			border-radius: 5px;
		}

		#status {
			font-size: 0.85rem;
			font-weight: bold;
			text-align: center;
		}

		#downloadLink {
			display: none;
			text-align: center;
			background: var(--success);
			color: white;
			padding: 12px;
			border-radius: 6px;
			text-decoration: none;
			font-weight: bold;
			margin-top: 10px;
		}

		#map {
			flex-grow: 1;
			height: 100vh;
			z-index: 500;
		}
	</style>
</head>

<body>
	<div id="sidebar">
		<h1>OGFimg</h1>

		<div>
			<span class="section-label">1. Configuration</span>
			<div class="control-group">
				<label>Map Source
					<select id="tileServer" onchange="changeTileServer()">
						<option value="https://tile.opengeofiction.net/ogf-carto/">OGF Carto</option>
						<option value="https://tiles04.rent-a-planet.com/ogf-topo/">OGF Topo</option>
						<option value="https://tiles06.opengeofiction.net/cyclogf/">CyclOGF</option>
						<option value="https://tiles02.rent-a-planet.com/arhet-carto/">Arhet Carto</option>
						<option value="https://tile.memomaps.de/tilegen/">ÖPNVKarte (OSM)</option>
						<option value="https://a.tile.openstreetmap.fr/hot/">Humanitarian (OSM)</option>
						<option value="https://a.tile.openstreetmap.fr/osmfr/">OSM France (OSM)</option>
					</select>
				</label>
				<label>Zoom Level (Detail)
					<input type="number" id="zoom" min="1" max="20" value="15">
				</label>
			</div>
		</div>

		<div>
			<span class="section-label">2. Area Selection</span>
			<div class="control-group">
				<div class="coord-grid">
					<label>Start Lat <input type="text" id="lat1" placeholder="0.00"></label>
					<label>Start Lon <input type="text" id="lon1" placeholder="0.00"></label>
					<label>End Lat <input type="text" id="lat2" placeholder="0.00"></label>
					<label>End Lon <input type="text" id="lon2" placeholder="0.00"></label>
				</div>
				<p style="font-size: 11px; color: #777; margin-top: 8px;">Tip: Use the rectangle tool on the map to select an area.</p>
			</div>
		</div>

		<div>
			<span class="section-label">3. Download & Process</span>
			<div id="tile-preview">
				<strong>Ready to fetch:</strong><br>
				Tiles: <span id="preview-count">0</span><br>
				Resolution: <span id="preview-size">0 x 0 px</span>
			</div>

			<div class="button-stack" style="margin-top: 10px;">
				<button id="startBtn" onclick="startDownload()">Start Download</button>
				<button id="stitchBtn" onclick="stitchMap()">Stitch Map</button>
			</div>
		</div>

		<div id="progress-container">
			<p style="font-size: 13px;">Progress: <span id="progress-text">0 / 0</span></p>
			<progress id="progress-bar" value="0" max="100"></progress>
		</div>

		<p id="status"></p>
		<a id="downloadLink" target="_blank">Save Image</a>
	</div>

	<div id="map"></div>
	<script>
	let map = L.map('map').setView([0, 0], 2);
	let tileLayer;
	// Function to change tile server dynamically
	function changeTileServer() {
		let selectedServer = document.getElementById('tileServer').value;
		if(tileLayer) {
			map.removeLayer(tileLayer);
		}
		if (selectedServer == "https://tile.opengeofiction.net/ogf-carto/" || selectedServer == "https://tiles04.rent-a-planet.com/ogf-topo/") {
			tileLayer = L.tileLayer(selectedServer + '{z}/{x}/{y}.png', {
			attribution: 'Tiles and data courtesy OpenGeofiction and contributors.'
		}).addTo(map);
		} else if (selectedServer == "https://tiles06.opengeofiction.net/cyclogf/") {
			tileLayer = L.tileLayer(selectedServer + '{z}/{x}/{y}.png', {
			attribution: 'Tiles and data courtesy OpenGeofiction and contributors. Tiles style by CyclOSM.'
		}).addTo(map);
		} else if (selectedServer == "https://tiles02.rent-a-planet.com/arhet-carto/") {
			tileLayer = L.tileLayer(selectedServer + '{z}/{x}/{y}.png', {
			attribution: 'Tiles and data created by Geofictician and contributors, built on the OpenStreetMap platform, including creative re-use of data shared by OpenStreetMap contributors.'
			}).addTo(map);

		} else if (selectedServer == "https://a.tile.openstreetmap.fr/hot/") {
			tileLayer = L.tileLayer(selectedServer + '{z}/{x}/{y}.png', {
			attribution: '(C) OpenStreetMap contributors. Tiles style by Humanitarian OpenStreetMap Team hosted by OpenStreetMap France.'
		}).addTo(map);
		} else if (selectedServer == "https://a.tile.openstreetmap.fr/osmfr/") {
			tileLayer = L.tileLayer(selectedServer + '{z}/{x}/{y}.png', {
			attribution: '(C) Openstreetmap France | Data (C) OpenStreetMap contributors'
		}).addTo(map);
		} else {
			tileLayer = L.tileLayer(selectedServer + '{z}/{x}/{y}.png', {
			attribution: 'Map memomaps.de CC-BY-SA, map data Openstreetmap ODbL'
		}).addTo(map);
		}

	}
	// Add default tile layer initially
	tileLayer = L.tileLayer('https://tile.opengeofiction.net/ogf-carto/{z}/{x}/{y}.png', {
		attribution: 'Tiles and data courtesy OpenGeofiction and contributors.'
	}).addTo(map);
	// Initialize map drawing controls
	let drawnItems = new L.FeatureGroup();
	map.addLayer(drawnItems);
	let drawControl = new L.Control.Draw({
		draw: {
			polyline: false,
			polygon: false,
			circle: false,
			marker: false,
			circlemarker: false,
			rectangle: true
		},
		edit: {
			featureGroup: drawnItems
		}
	});
	map.addControl(drawControl);
	// Event listener for drawing
	map.on(L.Draw.Event.CREATED, function(event) {
		drawnItems.clearLayers();
		let layer = event.layer;
		drawnItems.addLayer(layer);
		let bounds = layer.getBounds();
		document.getElementById('lat1').value = bounds.getSouthWest().lat.toFixed(5);
		document.getElementById('lon1').value = bounds.getSouthWest().lng.toFixed(5);
		document.getElementById('lat2').value = bounds.getNorthEast().lat.toFixed(5);
		document.getElementById('lon2').value = bounds.getNorthEast().lng.toFixed(5);

		updateTileCount(); // <--- Add this line
	});
	// Function to start downloading tiles
	function startDownload() {
	    let zoom = document.getElementById('zoom').value;
	    let lat1 = document.getElementById('lat1').value;
	    let lon1 = document.getElementById('lon1').value;
	    let lat2 = document.getElementById('lat2').value;
	    let lon2 = document.getElementById('lon2').value;
	    let tileServer = document.getElementById('tileServer').value;

	    if(!lat1 || !lon1 || !lat2 || !lon2) {
	        alert('Enter valid coordinates or draw a rectangle on the map!');
	        return;
	    }

	    // Reset UI
	    document.getElementById('status').innerText = "";
	    document.getElementById('downloadLink').style.display = "none";

	    document.getElementById('progress-container').style.display = "block";
	    document.getElementById('progress-text').innerText = "0 / 0";
	    document.getElementById('progress-bar').value = 0;

	    fetch('/start_download', {
	        method: 'POST',
	        headers: { 'Content-Type': 'application/json' },
	        body: JSON.stringify({
	            zoom: parseInt(zoom),
	            lat1: parseFloat(lat1),
	            lon1: parseFloat(lon1),
	            lat2: parseFloat(lat2),
	            lon2: parseFloat(lon2),
	            tile_server: tileServer
	        })
	    })
	    .then(async res => {
	        const data = await res.json();

	        // ❌ BACKEND ERROR
	        if (!res.ok || data.status === "Error") {

	            // Hide progress UI
	            document.getElementById('progress-text').innerText = "";
	            document.getElementById('progress-bar').value = 0;

	            // Show error message instead
	            document.getElementById('status').innerText = data.message || "Unexpected error";

	            return; // stop — don't start polling
	        }

	        // SUCCESS — show tiles counter
	        document.getElementById('status').innerText = "Download started…";
	        checkProgress();
	    })
	    .catch(err => {
	        document.getElementById('status').innerText = "Network error — try again.";
	        console.error(err);
	    });
	}
	// Function to check progress of tile downloading
	function checkProgress() {
		let interval = setInterval(() => {
			fetch('/progress').then(res => res.json()).then(data => {
				if(data.total > 0) {
					document.getElementById('progress-text').innerText = `${data.downloaded} / ${data.total}`;
					document.getElementById('progress-bar').max = data.total;
					document.getElementById('progress-bar').value = data.downloaded;
				}
				if(data.downloaded >= data.total) {
					clearInterval(interval);
					document.getElementById('status').innerText = "Download complete!";
				}
			});
		}, 1000);
	}
	// Function to stitch the map
	function stitchMap() {
		let zoom = document.getElementById('zoom').value;
		fetch('/stitch_map', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json'
			},
			body: JSON.stringify({
				zoom: parseInt(zoom)
			})
		}).then(res => res.json()).then(data => {
			if(data.status === 'Success') {
				document.getElementById('downloadLink').href = '/download/' + data.file.replace(/^.*[\\/]/, '');
				document.getElementById('downloadLink').style.display = 'block';
			}
		});
	}

	function updateTileCount() {
		let zoom = document.getElementById('zoom').value;
		let lat1 = document.getElementById('lat1').value;
		let lon1 = document.getElementById('lon1').value;
		let lat2 = document.getElementById('lat2').value;
		let lon2 = document.getElementById('lon2').value;

		if (!lat1 || !lon1 || !lat2 || !lon2) return;

		fetch('/calculate_tiles', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({
				zoom: parseInt(zoom),
				lat1: parseFloat(lat1),
				lon1: parseFloat(lon1),
				lat2: parseFloat(lat2),
				lon2: parseFloat(lon2)
			})
		})
		.then(res => res.json())
		.then(data => {
			document.getElementById('preview-count').innerText = data.total_tiles;
			document.getElementById('preview-size').innerText = data.dimensions;

			// Visual warning if it exceeds your 10,000 limit
			if (data.total_tiles > 1000) {
				document.getElementById('preview-count').style.color = "red";
				document.getElementById('preview-count').style.fontWeight = "bold";
			} else {
				document.getElementById('preview-count').style.color = "black";
				document.getElementById('preview-count').style.fontWeight = "normal";
			}
		});
	}

	// Attach listeners to input fields
	document.getElementById('zoom').addEventListener('input', updateTileCount);
	document.getElementById('lat1').addEventListener('input', updateTileCount);
	document.getElementById('lon1').addEventListener('input', updateTileCount);
	document.getElementById('lat2').addEventListener('input', updateTileCount);
	document.getElementById('lon2').addEventListener('input', updateTileCount);
	</script>
</body>

</html>
